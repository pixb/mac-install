# mpv.conf
# @author nate zhou
# @since 2023,2024,2025,2026

include=~/.config/mpv/osd.conf

loop
save-position-on-quit
display-tags-del='Description,Comment'

# rgb(0-1) equivalent to hex #111111
background=color
background-color=0.067/0.067/0.067/1

screenshot-dir=~/Pictures/Screenshots
screenshot-template="%f-%wH_%wM_%wS_%wT"

gpu-api=metal
