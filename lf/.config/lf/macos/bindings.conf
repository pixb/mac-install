# vim:ft=lf
# macOS overrides for bindings.conf - sourced after shared bindings

map Y $printf '%s' "$fx" | pbcopy
map gh $clear; git log --graph --pretty=format:'%Cred%h%Creset%C(yellow)%d%Creset %s%Cgreen(%cr)' --abbrev-commit | fzf --layout=reverse-list --preview-window=80%:bottom: --preview 'parse-fgl {}' --color | cut -d' ' -f2 | xargs git rev-parse | pbcopy
map gf $clear; fzf --preview 'git log --follow -p {} | bat --color=always --style=plain,changes' --preview-window=80%:bottom:
map U !du -csh $fx
map E $open -a "$EDITOR" "$f"
map gK $gpg --verify "$f" 2>&1 | less -Ri
map xs $open -a Preview "$f"
map W $~/.local/bin/setwall $f
map Cb $gzip -k $f
map CS $tar czvf "$f.tar.gz" "$(basename $f)"
