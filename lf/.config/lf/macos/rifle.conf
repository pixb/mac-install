# vim:ft=lf
# macOS overrides for rifle.conf - sourced after shared rifle.conf

cmd open &{{
    is_tty() { [ "$XDG_SESSION_TYPE" = "tty" ] || [ -z "$TERM" ] || [ "$TERM" = "dumb" ]; }
    open_img() {
        LIST="${TMPDIR:-/tmp}/lf-rifle"
        ${HOME}/.local/bin/lf-rearrange "$f" >/dev/null 2>&1 || exit 1
        qlmanage -p "$@" >/dev/null 2>&1 || open -a Preview "$f"
    }
    open_media() {
        LIST="${TMPDIR:-/tmp}/lf-rifle"
        ${HOME}/.local/bin/lf-rearrange "$f" >/dev/null 2>&1 || exit 1
        if is_tty; then
            lf -remote "send $id \$mpv --playlist=$LIST --playlist-start=0 --loop-playlist"
        else
            open -a mpv "$f" >/dev/null 2>&1 || mpv --playlist="$LIST" --playlist-start=0 --loop-playlist
        fi
    }
    open_doc() {
        if is_tty; then
            command -v pdftotext >/dev/null 2>&1 \
                && lf -remote "send $id \$pdftotext -layout $f - | less" \
                || lf -remote "send $id \$$EDITOR $f"
        else
            open "$f"
        fi
    }
    case $(file --mime-type -Lb "$f") in
        image/*|font/ttf)
            open_img "$@" ;;
        video/*|audio/*)
            open_media ;;
        */pdf|*/epub*|application/*opendocument*|*officedocument*)
            open_doc ;;
        application/octet-stream)
            case "$f" in
                *.gpg) lf -remote "send $id \$${HOME}/.local/bin/gpg-rifle \$f" ;;
                *.mp3) open_media ;;
                *)     lf -remote "send $id \$$EDITOR -p \$fx" ;;
            esac ;;
        message/rfc822)
            lf -remote "send $id \$mutt -f \$f" ;;
        text/troff)
            lf -remote "send $id \$man -l \$f" ;;
        text/html)
            case "$f" in
                *.svg) open_img "$f" ;;
                *.md)  lf -remote "send $id \$$EDITOR -p \$fx" ;;
                *)     is_tty && lf -remote "send $id \$w3m \$fx" || open "$f" ;;
            esac ;;
        text/*|*/json|inode/x-empty|application/javascript|application/mbox|application/pgp-signature|application/pgp-keys|application/x-wine-extension-ini|application/postscript)
            case "$f" in
                *.svg) open_img "$f" ;;
                *)     lf -remote "send $id \$$EDITOR -p \$fx" ;;
            esac ;;
        application/*)
            lf -remote "send $id \$${HOME}/.local/bin/scope \$f" ;;
    esac
}}
