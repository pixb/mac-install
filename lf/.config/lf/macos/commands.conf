# vim:ft=lf
# macOS overrides for commands.conf - sourced after shared commands

cmd lf-mirror &{{
    open -a Terminal "$(command -v lf)" 2>/dev/null || osascript -e 'tell application "Terminal" to do script "lf"'
}}
map <enter> lf-mirror

cmd extract %{{
    printf "extract file?(y/n)"
    read choice
    [ "$choice" = "y" ] || { lf -remote "send clear"; exit 0; }
    case "$f" in
        *.tar)                   tar xf "$f" ;;
        *.zip|*.apk)             unzip "$f" -d "$(basename "$f" | sed -E 's/\.(apk|zip)$//')" ;;
        *.7z)                    7z x "$f" ;;
        *.tar.gz|*.tgz|*.taz)    tar xzf "$f" ;;
        *.gz)                    gzip -dk "$f" ;;
        *.tar.bz2|*.tbz2|*.tbz)  tar xjf "$f" ;;
        *.bz2)                   bunzip2 -k "$f" ;;
        *.tar.xz|*.txz)          tar xJf "$f" ;;
        *.xz)                    xz -dk "$f" ;;
        *.tar.zst|*.tzst)        tar xf "$f" --zstd ;;
        *.zst)                   zstd -dk "$f" ;;
        *.rar)                   unar -e "$f" 2>/dev/null || unrar x "$f" ;;
        *) echo "unsupported archive" >&2 ;;
    esac
    lf -remote "send clear"
}}
map xx extract

cmd rotate %{{
    printf "rotate degree?: "
    read line
    magick "$f" -rotate "$line" "$f" 2>/dev/null || convert "$f" -rotate "$line" "$f"
    lf -remote "send clear"
}}
map xr rotate

cmd bulk-rename ${{
    old=$(mktemp); new=$(mktemp)
    if [ -n "$fs" ]; then
        for x in $fs; do basename "$x"; done > "$old"
    else
        ls -A | while IFS= read -r x; do printf '%s\n' "$x"; done > "$old"
    fi
    cp "$old" "$new"
    $EDITOR "$new"
    [ "$(wc -l < "$new")" -eq "$(wc -l < "$old")" ] || { rm -f "$old" "$new"; exit 1; }
    paste "$old" "$new" | while IFS=$(printf '\t') read -r src dst; do
        [ "$src" = "$dst" ] && continue
        [ -e "$dst" ] && continue
        mv -- "$src" "$dst"
    done
    rm -f "$old" "$new"
    lf -remote "send $id unselect"
}}
map xb bulk-rename
